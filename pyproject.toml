[project]
name = "newerp"
version = "0.1.0"
description = "Python version of NewErp: an ERP for a sewing workshop and online clothing store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2",
    "cryptography>=43",  # MySQL 8 default auth (caching_sha2_password) needs it
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newerp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ASYNC catches blocking calls (time.sleep, sync I/O) inside async functions.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.importlinter]
root_package = "newerp"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "newerp.api",
    "newerp.infrastructure",
    "newerp.application",
    "newerp.domain",
]
