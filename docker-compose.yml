# Local infrastructure for development: MySQL with the NewErp schema, Redis (Celery broker) and Kafka,
# plus the API built from the Dockerfile (http://localhost:8000/docs).
# For development with reload run the API on the host instead: `uv run fastapi dev src/newerp/main.py`.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the services are reached by name and their own port.
      NEWERP_DB_HOST: mysql
      NEWERP_DB_PORT: 3306
      NEWERP_DB_NAME: ${NEWERP_DB_NAME:-newerp_dev}
      NEWERP_DB_USER: ${NEWERP_DB_USER:-newerp}
      NEWERP_DB_PASSWORD: ${NEWERP_DB_PASSWORD:-newerp_dev_password}
      NEWERP_REDIS_URL: redis://redis:6379/0
      # Behind a reverse proxy: its address, so uvicorn takes the client IP from X-Forwarded-For (the login throttle
      # counts per IP). Only these addresses are trusted; anyone else could fake the header.
      FORWARDED_ALLOW_IPS: ${NEWERP_TRUSTED_PROXIES:-127.0.0.1}
      # Plain HTTP on localhost: in Development the auth cookie is not HTTPS-only, so login works here.
      NEWERP_ENVIRONMENT: Development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${NEWERP_DB_NAME:-newerp_dev}
      MYSQL_USER: ${NEWERP_DB_USER:-newerp}
      MYSQL_PASSWORD: ${NEWERP_DB_PASSWORD:-newerp_dev_password}
      MYSQL_ROOT_PASSWORD: ${NEWERP_DB_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Run once, on an empty volume, in this order (same as the Java integration tests).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/reconstructed.sql:/docker-entrypoint-initdb.d/2-reconstructed.sql:ro
      - ./db/erp.sql:/docker-entrypoint-initdb.d/3-erp.sql:ro
    healthcheck:
      # TCP, not the socket: during the first start the init scripts run on a socket-only temporary server,
      # so a socket ping would report "healthy" before db/*.sql are loaded.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  # MySQL for the tests only: data in memory and no disk syncs, so creating a test database takes a second.
  # Tests create and drop their own databases here (NEWERP_TEST_DB in tests/conftest.py).
  mysql-test:
    image: mysql:8.0
    command: >-
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --skip-log-bin --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --sync-binlog=0
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Kafka for order events: one node in KRaft mode (it keeps its own metadata, no ZooKeeper).
  # The image's default config listens on localhost:9092 and creates topics on the first message.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

volumes:
  mysql-data:
