{# A status with the colour it has on the old site (StatusChip.razor). #}
{% macro chip(color, name) -%}
<span class="chip"{% if color %} style="background: {{ color }}"{% endif %}>{{ name or "—" }}</span>
{%- endmacro %}

{# The options of a warehouse <select>: the main warehouse is the empty value (WarehouseSelect.razor). #}
{% macro place_options(warehouses, selected=None) -%}
<option value="">Основний склад</option>
{% for warehouse in warehouses %}
<option value="{{ warehouse.id }}"{% if warehouse.id == selected %} selected{% endif %}>{{ warehouse.name }}</option>
{% endfor %}
{%- endmacro %}

{# Previous/next links of a paged table; HTMX replaces only the target and puts the page into the address. #}
{% macro pager(url, target, result, pages, previous_page, next_page, noun) -%}
<div class="pager">
  {% if previous_page %}
  <a href="{{ url }}?{{ previous_page }}" hx-get="{{ url }}?{{ previous_page }}" hx-target="{{ target }}" hx-push-url="true">← Попередня</a>
  {% endif %}
  <span>Сторінка {{ result.page }} з {{ pages }} · {{ noun }}: {{ result.total_count }}</span>
  {% if next_page %}
  <a href="{{ url }}?{{ next_page }}" hx-get="{{ url }}?{{ next_page }}" hx-target="{{ target }}" hx-push-url="true">Наступна →</a>
  {% endif %}
</div>
{%- endmacro %}

{# Business errors and warnings of other modules under a form. #}
{% macro messages(error=None, warnings=(), saved_text=None) -%}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% for warning in warnings %}<p class="warning">{{ warning }}</p>{% endfor %}
{% if saved_text and not error %}<p class="ok">{{ saved_text }}</p>{% endif %}
{%- endmacro %}
